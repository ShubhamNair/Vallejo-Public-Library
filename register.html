<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for a Library Card</title>
</head>
<body>
    <header>
        <h1>Get Your Library Card</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html">Library Catalog</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Library Card Registration</h2>
            <form action="/register" method="post">
                <fieldset>
                    <legend>Personal Information</legend>
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </fieldset>
                <fieldset>
                    <legend>Address</legend>
                    <label for="address">Address:</label>
                    <textarea id="address" name="address" required></textarea>
                </fieldset>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Contact us: <a href="mailto:nair.shu@northeastern.edu">nair.shu@northeastern.edu</a></p>
    </footer>
</body>
</html>
